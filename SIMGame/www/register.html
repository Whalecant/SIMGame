<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title data-i18n="title"> Shipwright's Countdown</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="subPage.css">

        <script src="scripts/systems/register.js" defer></script>
    </head>

    <body>
        <!--simple notice and what not-->
        <div id="mobileBlocker">
            <h2 style="color: maroon; ">Desktop Only Page</h2>
            <p> We apolgogize but this portal requires a wider screen. Please view on desktop or in a wider screen <br>(Translataion: I'm too lazy to set up mobile port at the moment ~ lead programmer)</p>
        </div>

        <div class="staticPageContainer">
            <h1>Register</h1>
            <br>

            <form id="registerForm" onsubmit="handleRegister(event)" style="display:flex; flex-direction: column;gap: 1.25rem; align-items: center;">
                <div style="width: 100%; max-width: 320px; text-align: left;">
                    <label for="username" style="display: block; margin-bottom: 0.4rem; color: skyblue; font-size: 0.9rem;">Username</label>
                    <input type="text" id="username" required style="width:100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #121826; color: snow; font-family: inherit;">
                </div>

                <div style="width: 100%; max-width: 320px; text-align: left;">
                    <label for="password" style="display: block; margin-bottom: 0.4rem; color: skyblue; font-size: 0.9rem;">Password</label>
                    <input type="password" id="password" required style="width:100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #121826; color: snow; font-family: inherit;">
                </div>

                <p id="registerMessage" style="color: lightgreen; font-size: 0.9rem; min-height: 1.2rem; margin: 0;"></p>
                
                <div style="display: flex; gap: 1rem; margin-top: 0.5rem; justify-content: center; width: 100%;">

                    <button type="button" class="navBtn" style="width: 15%; padding: 0.6rem 1.8rem; margin: 0;" onclick="window.location.href='index.html'">
                        <span class="btnTitle">Cancel</span>
                    </button>

                    <button type="submit" id="registerBtn" class="navBtn" onclick="window.location.href='login.html'" style="width: 15%; padding: 0.6rem 1.8rem; margin: 0;">
                        <span class="btnTitle">Register</span>
                    </button>
                    
                </div>
            </form>
        </div>
    </body>
</html>
