<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shipwright's Countdown · Navigation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1612;
            font-family: 'Courier New', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .indexCard {
            width: min(90vw, 700px);
            background-color: #f3ecd8;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 0 0 1px #b8a88a;
            padding: 2.5rem 2rem;
            border-left: 8px solid #7a5c3a;
            border-right: 2px solid #b8a88a;
            text-align: center;
        }

        .indexCard h1 {
            font-size: 2rem;
            color: #4a2e1b;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px double #a0845e;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .indexCard .subtitle {
            font-style: italic;
            color: #6f5a44;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .navGrid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .navBtn {
            background-color: #e6d8bc;
            border: 2px solid #9b8b72;
            border-radius: 30px;
            padding: 0.9rem 1.5rem;
            color: #2e241a;
            cursor: pointer;
            font-family: 'Courier New', 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #7a5c3a;
            width: 100%;
            text-align: center;
        }

        .navBtn:hover {
            background-color: #dac9a8;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #7a5c3a;
        }

        .navBtn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #7a5c3a;
        }

        #mobileBlocker {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1612;
            color: #f3ecd8;
            z-index: 999999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        #mobileBlocker h2 {
            color: #d4a373;
            border-bottom: 1px dashed #b09b7e;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        #mobileBlocker p {
            color: #cfc1a8;
            max-width: 400px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            #mobileBlocker {
                display: flex !important;
            }
            .indexCard {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="mobileBlocker">
        <h2>Desktop Only Page</h2>
        <p>We apologize, but this portal requires a wider screen. Please view on desktop or in a wider screen.</p>
    </div>

    <div class="indexCard">
        <h1>Navigation</h1>
        <p class="subtitle">Access team credentials, media archives, and world lore</p>

        <div class="navGrid">
            <button class="navBtn" onclick="window.location.href='memberList.html'">About Us</button>
            <button class="navBtn" onclick="window.location.href='lore.html'">Journal</button>
            <button class="navBtn" onclick="window.location.href='gallery.html'">Gallery</button>
            <button class="navBtn" onclick="window.location.href='changeLog.html'">Change Notes</button>
            <button class="navBtn" onclick="window.location.href='index.html'">Return to Game</button>
        </div>
    </div>

</body>
</html>
