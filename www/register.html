<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title data-i18n="title"> Shipwright's Countdown</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="subPage.css">

        <script src="scripts/systems/register.js" defer></script>
    </head>

    <body>
        <!--simple notice and what not-->
        <div id="mobileBlocker">
            <h2>ACCESS RESTRICTED</h2>
            <p>Please access this terminal via desktop screen size for optimal viewing.</p>
        </div>

        <div class="indexCard">
            <div class="page">
                <header class="archiveHeader">
                    <h1>REGISTER</h1>
                    <div class="subtitle">Create a new account</div>
                </header>

                <div id="registerMessage" style="margin-bottom: 1rem; font-weight: bold; text-align: center;"></div>

                <form class="authForm" id="registerForm" onsubmit="handleRegister(event)">
                    <div class="formGroup">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="formGroup">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="new-password">
                    </div>

                    <div class="buttonWrap" style="margin-top: 1rem;">
                        <button type="submit" class="navBtn" style="width: 100%;">REGISTER</button>
                    </div>
                </form>

                <div class="authFooter">
                    Already registered? <a href="login.html">LOGIN</a>
                </div>

                <div class="buttonWrap">
                    <button type="button" class="navBtn" onclick="window.location.href='index.html'">BACK TO MAIN MENU</button>
                </div>
            </div>
        </div>
    </body>
</html>
