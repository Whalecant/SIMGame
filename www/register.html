<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title data-i18n="title"> Shipwright's Countdown</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="subPage.css">

        <script src="scripts/core/lang.js"></script>
        <script src="scripts/core/strings.js"></script>

        <script src="scripts/systems/register.js" defer></script>
    </head>

    <body class="authPage">
        <!--simple notice and what not-->
        <div id="mobileBlocker">
            <h2 data-i18n="restrictedTitle">ACCESS RESTRICTED</h2>
            <p data-i18n="restrictedText">Please access this terminal via desktop screen size for optimal viewing.</p>
        </div>

        <div class="indexCard">
            <div class="page">
                <header class="archiveHeader">
                    <h1 data-i18n="registerHeading">REGISTER</h1>
                    <div class="subtitle" data-i18n="registerSubtitle">Create a new account</div>
                </header>

                <div id="registerMessage" style="margin-bottom: 1rem; font-weight: bold; text-align: center;"></div>

                <form class="authForm" id="registerForm" onsubmit="handleRegister(event)">
                    <div class="formGroup">
                        <label for="username" data-i18n="usernameLabel">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="formGroup">
                        <label for="password" data-i18n="passwordLabel">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="new-password">
                    </div>

                    <div class="buttonWrap" style="margin-top: 1rem;">
                        <button type="submit" class="navBtn" style="width: 100%;" data-i18n="registerBtn">REGISTER</button>
                    </div>
                </form>

                <div class="authFooter">
                    <span data-i18n="alreadyRegistered">Already registered?</span> <a href="login.html" data-i18n="loginBtn">LOGIN</a>
                </div>

                <div class="buttonWrap">
                    <button type="button" class="navBtn" onclick="window.location.href='index.html'" data-i18n="backToMenu">BACK TO MAIN MENU</button>
                </div>
            </div>
        </div>
    </body>
</html>
